[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finverify"
version = "0.5.0"
description = "财报数字溯源与会计勾稽校验 —— 让 LLM 给出的每个财务数字都能点开验证"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Xue Dingtian" }]
keywords = [
    "llm",
    "financial-report",
    "provenance",
    "accounting",
    "hallucination-detection",
    "rag",
    "agent-evaluation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# 校验层（validation.py）零第三方依赖 —— 这是刻意设计：
# 勾稽引擎必须纯确定性，任何第三方依赖都是风险。
# 解析层需要 PyMuPDF（无框线表格识别 + 行级坐标）。
dependencies = ["pymupdf>=1.24"]

[project.optional-dependencies]
# 抽取层的可选 LLM 增强（当前规则抽取为主）
llm = ["httpx>=0.27", "tenacity>=8.2"]
# 评测层
eval = ["ragas>=0.1", "pandas>=2.0", "numpy>=1.26"]
# Web 报告：零额外依赖 —— web.py 只用已在核心依赖里的 PyMuPDF 渲染页面，
# 生成的是单文件 HTML，不需要 FastAPI / uvicorn / 前端构建。
web = []
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/KBber/finverify"
Repository = "https://github.com/KBber/finverify"
Issues = "https://github.com/KBber/finverify/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
